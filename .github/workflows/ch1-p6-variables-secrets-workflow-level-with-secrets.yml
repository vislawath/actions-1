# Workflow: Variables and secrets example
# Summary: Shows environment variable usage for Docker build, login,
# and publish steps (including hard-coded credentials for demo only).
name: Exploring variables and secrets

on: push

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Docker build
        run: echo "docker build -t ${{vars.CONTAINER_REGISTRY}}/${{vars.DOCKER_USERNAME}}/${{vars.IMAGE_NAME}}:latest"

      - name: Docker login
        run: echo "docker login --username=$DOCKER_USERNAME --password=${{secrets.DOCKER_PASSWORD}}"

      - name: Docker publish
        run: echo "docker push -t ${{vars.CONTAINER_REGISTRY}}/${{vars.DOCKER_USERNAME}}/${{vars.IMAGE_NAME}}:latest"

  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "docker run -d -p 8080:80 ${{vars.CONTAINER_REGISTRY}}/${{vars.DOCKER_USERNAME}}/${{vars.IMAGE_NAME}}:latest"
