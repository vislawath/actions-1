
name: ch1-p11 workflow filters

on:
  workflow_dispatch:
  schedule:
    - cron: '*/59 0 * * *' #  Run every 59 minutes to avoid hitting the hourly API rate limit for unauthenticated requests
  push:
    # Scenario1: Only trigger on pushes to the main branch and when files in the src directory are changed
    branches:
      - main
      - '!feature/*' # Ignore pushes to feature branches, but allow pushes to other branches like main, develop, etc.

    # Scenario2: Ignore pushes to feature branches
    # branches-ignore:
    #   - 'feature/*' # Ignore pushes to feature branches, but allow pushes to other branches like main, develop, etc.
    #   - 'test/**' # Ignore pushes to test branches, but allow pushes to other branches like main, develop, etc.
  # Scenario3: Only trigger on pull requests targeting the main branch and when files in the src directory are changed
  pull_request:
    types: [opened, closed]
    paths-ignore:
      - 'docs/**' # Ignore changes to documentation files, but trigger on changes to other files
    branches:
      - main # Only trigger on pull requests targeting the main branch
    # paths:
    #   - 'src/**' # Only trigger on changes to files in the src directory

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Hello world
        run: echo this workflow is for event type - ${{ github.event_name }}
